version: '3.8'

services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: backorder_db
    environment:
      POSTGRES_DB: backorder_pcm
      POSTGRES_USER: pcm_user
      POSTGRES_PASSWORD: pcm_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backorder_network
    restart: unless-stopped

  # Redis para Cache y Celery
  redis:
    image: redis:7-alpine
    container_name: backorder_redis
    ports:
      - "6379:6379"
    networks:
      - backorder_network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backorder_backend
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://pcm_user:pcm_password_2026@db:5432/backorder_pcm
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ./Samples:/app/Samples
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    networks:
      - backorder_network
    restart: unless-stopped

  # Celery Worker para tareas asíncronas
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backorder_celery
    command: python celeryworker.py worker --loglevel=info
    container_name: backorder_celery_worker
    command: celery -A celery_app.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://pcm_user:pcm_password_2026@db:5432/backorder_pcm
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
      - backend
    networks:
      - backorder_network
    restart: unless-stopped

  # Celery Beat para tareas periódicas
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backorder_celery_beat
    command: celery -A celery_app.celery beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://pcm_user:pcm_password_2026@db:5432/backorder_pcm
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
      - backend
    networks:
      - backorder_network
    restart: unless-stopped

  # Frontend Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backorder_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - backorder_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  backorder_network:
    driver: bridge
